name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/smoke.mjs finds /usr/bin/google-chrome on its own; no CHROME_PATH needed.
      - run: npm test
